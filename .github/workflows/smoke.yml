name: Smoke Test

on:
  push:
  pull_request:

jobs:
  demo-api-smoke:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install demo API dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile demo API
        run: python -m py_compile app.py smoke_test.py

      - name: Run smoke test
        run: python smoke_test.py

  retrieval-eval-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluation dataset and metric logic
        run: |
          python -m py_compile eval/run_retrieval_eval.py eval/eval_smoke_test.py eval/isolation_smoke_test.py eval/quality_gate.py eval/quality_gate_smoke_test.py eval/paired_bootstrap.py eval/paired_bootstrap_smoke_test.py eval/run_experiment_matrix.py eval/experiment_matrix_smoke_test.py
          python eval/run_retrieval_eval.py --validate-only
          python eval/eval_smoke_test.py
          python eval/isolation_smoke_test.py
          python eval/quality_gate_smoke_test.py
          python eval/paired_bootstrap_smoke_test.py
          python eval/experiment_matrix_smoke_test.py
